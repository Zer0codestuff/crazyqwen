[project]
name = "crazyqwen"
version = "0.1.0"
description = "Local Qwen-Image 2.1 (uncensored, MLX 8-bit) image generator for Apple Silicon"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mflux==0.23.0",
    "huggingface-hub>=1.1.6,<2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=12.3,<13",  # 13.0 imports numbers._IntegralLike, missing on Python 3.13
]

[project.scripts]
crazyqwen = "crazyqwen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crazyqwen"]
